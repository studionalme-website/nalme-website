<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost — Studio Nalmé</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/logos/favicon-red.svg">
<style>
@font-face{font-family:'Friend';src:url('assets/fonts/Friend-Italic.otf') format('opentype');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:'Kumbh Sans';src:url('assets/fonts/KumbhSans.ttf') format('truetype');font-weight:100 900;font-display:swap}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ivory:#fffaf0;--brick:#8e3432;--taupe:#957465;--ink:#3d3a36;--linen:#d9d2c5}
html{font-size:16px}
body{background:var(--ivory);color:var(--ink);font-family:'Kumbh Sans',sans-serif;font-weight:300;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center}
main{max-width:560px}
.mark{width:88px;height:auto;display:block;margin:0 auto 2.4rem;opacity:.92}
.code{font-family:'Friend',sans-serif;font-style:italic;font-size:6rem;line-height:1;color:var(--brick);margin-bottom:1.6rem}
h1{font-family:'Kumbh Sans',sans-serif;font-weight:200;font-size:clamp(1.8rem,3.5vw,2.4rem);line-height:1.2;letter-spacing:-.02em;margin-bottom:1.2rem}
h1 em{font-style:normal;color:var(--brick);font-family:'Friend',sans-serif;font-weight:400}
p{font-family:'Friend',sans-serif;font-style:italic;font-size:1.15rem;line-height:1.55;color:var(--taupe);margin-bottom:2.8rem;max-width:34ch;margin-left:auto;margin-right:auto}
.btn{display:inline-flex;align-items:center;gap:.8rem;padding:.95rem 1.8rem;font-family:'Kumbh Sans',sans-serif;font-weight:500;font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;text-decoration:none;color:var(--ivory);background:var(--brick);border:1px solid var(--brick);transition:background .4s,border-color .4s}
.btn:hover{background:var(--ink);border-color:var(--ink)}
.links{margin-top:2rem;display:flex;justify-content:center;gap:1.6rem;flex-wrap:wrap;font-family:'Kumbh Sans',sans-serif;font-weight:500;font-size:.62rem;letter-spacing:.32em;text-transform:uppercase}
.links a{color:var(--taupe);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px;transition:color .3s,border-color .3s}
.links a:hover{color:var(--brick);border-bottom-color:var(--brick)}
</style>
</head>
<body>
<main>
  <img class="mark" src="assets/logos/secondary-emblem-red.svg" alt="">
  <div class="code">404</div>
  <h1>This page has not yet been <em>built.</em></h1>
  <p>The link may have moved, or this corner is still under construction. Both happen, in their own time.</p>
  <a href="/" class="btn">Return to the studio</a>
  <div class="links">
    <a href="/work.html">Work</a>
    <a href="/store.html">Store</a>
    <a href="/ventures.html">Ventures</a>
    <a href="/journal.html">Journal</a>
    <a href="/about.html">About</a>
  </div>
</main>
</body>
</html>
